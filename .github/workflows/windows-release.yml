name: Windows — tests et distributions

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  tests:
    name: Tests Windows (Python 3.12 x64)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/Sources/PrepaPilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            Sources/PrepaPilot/requirements.txt
            Sources/PrepaPilot/requirements-dev.txt
      - name: Installer les dépendances de test
        run: python -m pip install -r Sources/PrepaPilot/requirements-dev.txt
      - name: Vérifier la préparation des distributions
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Vérifier l'application
        run: python -m unittest discover -s Sources/PrepaPilot/tests -v
      - name: Vérifier les outils de préparation
        run: python -m unittest discover -s Outils -p 'test_*.py' -v

  build:
    name: Construire Windows x64
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            Sources/PrepaPilot/requirements.txt
            Sources/PrepaPilot/requirements-dev.txt
      - name: Installer les dépendances de construction
        run: python -m pip install -r Sources/PrepaPilot/requirements-dev.txt
      - name: Préparer le client Google commun de la distribution
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON || vars.GOOGLE_OAUTH_CLIENT_JSON }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON)) {
            $googleClientPath = Join-Path $env:RUNNER_TEMP 'prepapilot-google-oauth-client.json'
            [System.IO.File]::WriteAllText($googleClientPath, $env:GOOGLE_OAUTH_CLIENT_JSON, [System.Text.UTF8Encoding]::new($false))
            "PREPAPILOT_GOOGLE_CLIENT=$googleClientPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } elseif ($env:RELEASE_REF_TYPE -eq 'tag' -and -not (Test-Path -LiteralPath 'Sources/PrepaPilot/assets/google-oauth-client.json')) {
            throw 'Publication interrompue : configure GOOGLE_OAUTH_CLIENT_JSON avec le client OAuth Application de bureau commun à PrépaPilot. Aucun compte ou jeton personnel ne doit être fourni.'
          }
      - name: Préparer Inno Setup 6.7.3 officiel
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $compilerDir = Join-Path $env:RUNNER_TEMP 'PrepaPilot-InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installerPath
          $signature = Get-AuthenticodeSignature -LiteralPath $installerPath
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'La signature du compilateur Inno Setup officiel est invalide.'
          }
          $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', '/PORTABLE=1', "/DIR=`"$compilerDir`"")
          $process = Start-Process -FilePath $installerPath -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup : code $($process.ExitCode)." }
          $compilerPath = Join-Path $compilerDir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compilerPath)) { throw 'ISCC.exe est absent.' }
          "PREPAPILOT_ISCC=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Construire et tester les distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $arguments = @('scripts/build_release.py', '--iscc', $env:PREPAPILOT_ISCC, '--repository', $env:RELEASE_REPOSITORY)
          if ($env:PREPAPILOT_GOOGLE_CLIENT) {
            $arguments += @('--google-oauth-client', $env:PREPAPILOT_GOOGLE_CLIENT)
          }
          if ($env:RELEASE_REF_TYPE -eq 'tag') {
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw 'Le tag de publication doit respecter vX.Y.Z.'
            }
            $arguments += @('--expect-version', $env:RELEASE_TAG.Substring(1))
            $arguments += '--require-google-drive'
          }
          & python @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retirer le fichier temporaire du client Google
        if: always()
        run: |
          $googleClientPath = Join-Path $env:RUNNER_TEMP 'prepapilot-google-oauth-client.json'
          if (Test-Path -LiteralPath $googleClientPath) {
            Remove-Item -LiteralPath $googleClientPath
          }
      - name: Vérifier installation, réinstallation et désinstallation
        run: |
          $installer = Get-ChildItem -Path 'dist/PrepaPilot-*-Setup.exe'
          if (@($installer).Count -ne 1) { throw 'Un seul installateur est attendu.' }
          & ./scripts/verify_installer.ps1 -Installer $installer.FullName
      - name: Conserver les fichiers téléchargeables
        uses: actions/upload-artifact@v4
        with:
          name: PrepaPilot-Windows-x64
          path: |
            dist/PrepaPilot-*-Setup.exe
            dist/PrepaPilot-*-Windows-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publier les fichiers de la version
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrepaPilot-Windows-x64
          path: dist
      - name: Créer la Release ou compléter la Release existante
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=("dist/PrepaPilot-${version}-Setup.exe" "dist/PrepaPilot-${version}-Windows-portable.zip" "dist/SHA256SUMS.txt")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "PrépaPilot ${version}" --generate-notes
          fi
